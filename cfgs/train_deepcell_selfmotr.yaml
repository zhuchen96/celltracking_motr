tracking: true
freeze_backbone: false
freeze_backbone_and_encoder: False
lr: 0.0002
lr_backbone_names: ['backbone.0']
lr_backbone: 0.00002
lr_linear_proj_names: ['reference_points', 'sampling_offsets']
lr_linear_proj_mult: 0.1
lr_track: 0.0001
overwrite_lrs: false
overwrite_lr_scheduler: false
batch_size: 1
weight_decay: 0.0001
epochs: 24
lr_drop: 20
target_size: (576,600)
# Number of object queries
num_queries: 400
# Flexible divisions
flex_div: false
# Tracking 2 sequential frames - use prev_prev, prev and cur frame (detection 1 frame and track for 2 frames - 3 frames total)
use_prev_prev_frame: true
# For 2D data, image will be randomly cropped around objects
crop: false
# Shift only applies to cropped images. Crop will be shifted between sequential frames
shift: True
# gradient clipping max norm
clip_max_norm: 0.1
# Deformable DETR parameters
deformable: true
with_box_refine: true
two_stage: true
pre_norm: false
dec_n_points: 4
enc_n_points: 4
# Model parameters
freeze_detr: false
load_mask_head_from_model: null
# Backbone
backbone: resnet50
dilation: false
position_embedding: sine
num_feature_levels: 3
# Transformer
enc_layers: 4
dec_layers: 4
num_OD_layers: 1
dim_feedforward: 512
hidden_dim: 144
dropout: 0.1
nheads: 8
use_dab: true
# DN-DETR
dn_track: true
dn_track_l1: 0.2
dn_track_l2: 0.1
dn_object: false
dn_object_FPs: false
dn_object_l1: 0.3
dn_object_l2: 0.15
dn_enc: false
dn_enc_l1: 0.3
dn_enc_l2: 0.15
enc_FN: 1
dn_track_group: true
tgt_noise: 0.1
share_bbox_layers: false
CoMOT: true
CoMOT_loss_ce: false
init_boxes_from_masks: true
refine_track_queries: true
refine_object_queries: true
refine_div_track_queries: false
use_div_box_as_ref_pts: true
init_enc_queries_embeddings: false
backprop_prev_frame: true
multi_frame_attention: false
multi_frame_attention_separate_encoder: false
overflow_boxes: true
# Segmentation
masks: true
mask_dim: 288
enc_masks: true
use_img_for_mask: false
# Matcher
set_cost_class: 4.0
set_cost_bbox: 5.0
set_cost_giou: 2.0
set_cost_mask: 5.0
set_cost_dice: 2.0
match_masks: true
num_points: 10000
# Loss
aux_loss: true
return_intermediate_masks: false
loss_coef: 1.0
cls_loss_coef: 4.0
bbox_loss_coef: 5.0
giou_loss_coef: 2.0
contrastive_loss_coef: 0.0
# Division loss — doubled vs baseline, plus lookahead
div_loss_coef: 10.0
track_div_loss_coef: 5.0
div_ahead_loss_coef: 1.0
pos_wei_loss_coef: 5.0
dice_loss_coef: 5.0
mask_loss_coef: 5.0
mask_weight_target_cell_coef: 2.0
mask_weight_all_cells_coef: 10.0
dn_object_coef: 1.0
dn_track_coef: 1.0
FN_det_query_loss_coef: 2.0
object_queies_loss_coef: 1.0
touching_edge_loss_coef: 0.2
flex_div_loss_coef: 0.
eos_coef: 0.1
focal_loss: true
focal_alpha: 0.25
focal_gamma: 2
# Dataset
dataset: deepcell
num_plots: 10
# Paths
output_dir: /srv/home/chen/Cell-TRACTR/results/deepcell_selfmotr_v1
data_dir: /srv/home/chen/Cell-TRACTR/data
device: cuda
seed: 42
# Resume from best deepcell checkpoint (warm start)
resume: /srv/home/chen/Cell-TRACTR/results/deepcell_motr_v2/checkpoint.pth
resume_shift_neuron: False
resume_optim: false
start_epoch: 0
eval_only: false
num_workers: 0
val_interval: 5
debug: false
save_model_interval: 5
# Distributed
world_size: 2
dist_url: env://
cls_threshold: 0.5
iou_threshold: 0.5
obj_threshold: 0.4
# Data Viz
data_viz: false
display_all: False
hooks: False
avg_attn_weight_maps: True
# SelfMOTR
use_qim: false
num_qim_layers: 1
use_temporal_memory: false
temporal_dropout_prob: 0.1
track_query_noise: 0.02
random_drop: 0.0
qim_update_ref_pts: false
qim_score_thresh: 0.5
selfmotr_fp_ratio: 0.0
selfmotr_fp_score_thresh: 0.3
# MemoryBank — keep enabled (beneficial for deepcell, only net-negative on moma)
use_motr: true
memory_bank_len: 3
memory_bank_save_thresh: 0.0
memory_bank_spatial_attn: false
# Dual-query detect pass — enabled
use_dual_query: true
num_queries_detect: 400
detect_score_thresh: 0.5
lambda_detect: 0.5
# CellposeSAM / SAM2 (unused with backbone: resnet50)
cellposesam_checkpoint: /srv/home/chen/.cellpose/models/cpsam
freeze_cellposesam_encoder: true
unfreeze_cellposesam_blocks: 8
sam2_checkpoint: /srv/home/chen/Cell-TRACTR/ckpt/sam2.1_hiera_large.pt
unfreeze_sam2_stages: 1
